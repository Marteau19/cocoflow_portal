<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ecoflo Portal</title>

    <!--
      Plus Jakarta Sans and IBM Plex Mono, at the three weights the design
      system allows. 600 is deliberately not loaded.

      Self-hosted rather than fetched from the Google Fonts CDN: this runs on a
      projector, and a system carrying its hierarchy in type cannot fall back to
      Arial because the room has bad wifi. Preloaded so the first paint is
      already in the right typeface.
    -->
    <link rel="preload" href="/fonts/plus-jakarta-sans-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plus-jakarta-sans-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
